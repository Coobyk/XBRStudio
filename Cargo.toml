[package]
name = "xbrstudio"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
gpui = "0.2.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
xbrz-rs = "0.1.0"
zip = { version = "2", default-features = false, features = ["deflate"] }

[[bin]]
name = "xbrstudio"
path = "src/main.rs"

[[bin]]
name = "gui"
path = "src/bin/gui.rs"
