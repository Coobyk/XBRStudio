[package]
name = "xbrstudio"
version = "0.1.0"
edition = "2024"

[features]
default = ["gpu"]
# GPU-accelerated upscaling backend (wgpu compute). Disable for CPU-only builds.
gpu = ["dep:wgpu"]

[dependencies]
clap = { version = "4", features = ["derive"] }
gpui = "0.2.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rayon = "1.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
xbrz-rs = "0.1.0"
zip = { version = "2", default-features = false, features = ["deflate"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
toml = "1.1"
sha2 = "0.11"
dirs = "5"
wgpu = { version = "30", optional = true }

[[bin]]
name = "xbrstudio"
path = "src/main.rs"

[[bin]]
name = "gui"
path = "src/bin/gui.rs"
